[package]
name = "native-audio-wav-prototype"
version = "0.1.0"
description = "Throwaway Tauri prototype for native audio and WAV Project format"
edition = "2024"

[lib]
name = "native_audio_wav_prototype_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.100"
chrono = { version = "0.4.45", features = ["serde"] }
cpal = "0.15.3"
crossbeam-channel = "0.5.15"
hound = "3.5.1"
roxmltree = "0.21.1"
scraper = "0.24.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.19"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 0
incremental = false
